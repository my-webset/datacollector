<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperera — School Website Data Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#232017;
    --ink-soft:#5b5749;
    --paper:#f7f3ea;
    --paper-raised:#fffdf7;
    --line:#ddd5c0;
    --seal:#a13d2c;
    --seal-ink:#7c2e21;
    --gold:#b3862a;
    --gold-soft:#e8d9ab;
    --navy:#232c47;
    --sage:#3f6b4f;
    --sage-soft:#dfe9e1;
    --danger:#a13d2c;
    --radius:2px;
    --shadow:0 1px 0 rgba(35,32,23,.06), 0 8px 24px -14px rgba(35,32,23,.35);
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink:#efe9db;
      --ink-soft:#b9b19c;
      --paper:#1b1912;
      --paper-raised:#242018;
      --line:#3a352a;
      --gold:#d4ab4a;
      --gold-soft:#4a3c1e;
      --navy:#aab4d6;
      --sage:#8fbb9e;
      --sage-soft:#25332a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#efe9db;
    --ink-soft:#b9b19c;
    --paper:#1b1912;
    --paper-raised:#242018;
    --line:#3a352a;
    --gold:#d4ab4a;
    --gold-soft:#4a3c1e;
    --navy:#aab4d6;
    --sage:#8fbb9e;
    --sage-soft:#25332a;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px;}
  .wrap-wide{max-width:1080px;margin:0 auto;padding:0 20px;}

  /* ---------- header ---------- */
  header.site{
    border-bottom:1px solid var(--line);
    background:var(--paper-raised);
    position:sticky;top:0;z-index:40;
  }
  .head-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;max-width:1080px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
  .brand img{width:30px;height:30px;object-fit:contain;filter:var(--logo-filter,none);}
  :root[data-theme="dark"] .brand img, :root:not([data-theme="light"]) .brand img{
    @media (prefers-color-scheme: dark){ filter:invert(1); }
  }
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.2px;color:var(--ink);}
  .brand .word small{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.5px;color:var(--ink-soft);margin-top:-2px;}
  nav.top{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:600;}
  nav.top a, nav.top button.link{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:14px;font-weight:600;font-family:inherit;padding:0;}
  nav.top a:hover, nav.top button.link:hover{color:var(--ink);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);font-weight:700;font-size:14.5px;
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    text-decoration:none;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(0,0,0,.35);}
  .btn:active{transform:translateY(0);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1f1706;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.sage{background:var(--sage);border-color:var(--sage);color:#0d1b12;}
  .btn.sm{padding:8px 14px;font-size:13px;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}

  /* ---------- home / hero ---------- */
  .hero{padding:64px 0 40px;border-bottom:1px solid var(--line);}
  .eyebrow{
    font-size:12px;font-weight:700;color:var(--seal);
    border:1px solid var(--seal);display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:99px;margin-bottom:18px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--seal);}
  .hero h1{font-size:44px;line-height:1.08;font-weight:600;margin:0 0 16px;max-width:640px;}
  .hero p.lead{font-size:17px;color:var(--ink-soft);max-width:520px;margin:0 0 28px;}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap;}
  @media (max-width:640px){ .hero h1{font-size:32px;} }

  .ticket-strip{
    display:flex;gap:22px;flex-wrap:wrap;margin-top:36px;padding-top:24px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--ink-soft);
  }
  .ticket-strip b{color:var(--ink);font-weight:700;}

  /* ---------- section heading ---------- */
  .section-head{margin:0 0 30px;}
  .section-head .tag{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--gold);text-transform:uppercase;}
  .section-head h2{font-size:28px;font-weight:600;margin:6px 0 8px;}
  .section-head p{color:var(--ink-soft);font-size:15px;max-width:560px;margin:0;}

  section.block{padding:52px 0;}
  section.block.lined{border-bottom:1px solid var(--line);}

  /* ---------- pricing ---------- */
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:720px){.plans{grid-template-columns:1fr;}}
  .plan-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 26px;display:flex;flex-direction:column;position:relative;
  }
  .plan-card.featured{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .plan-tag{
    position:absolute;top:-11px;right:24px;background:var(--gold);color:#1f1706;
    font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:99px;
  }
  .plan-card h3{font-size:22px;margin:0 0 4px;font-weight:600;}
  .plan-card .price{font-size:36px;font-weight:700;font-family:'Fraunces',serif;margin:6px 0 2px;}
  .plan-card .price small{font-size:14px;font-weight:500;color:var(--ink-soft);}
  .plan-card .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
  .plan-card ul{list-style:none;margin:0 0 22px;padding:0;flex:1;}
  .plan-card ul li{
    display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;border-bottom:1px dotted var(--line);
  }
  .plan-card ul li:last-child{border-bottom:none;}
  .plan-card ul li .tick{color:var(--sage);font-weight:800;flex:0 0 auto;}
  .plan-card ul li.included{color:var(--ink-soft);}
  .plan-card ul li.included .tick{color:var(--ink-soft);}

  .ai-tail{
    margin-top:36px;border:1px dashed var(--seal);border-radius:var(--radius);
    padding:20px 22px;background:var(--paper-raised);display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  }
  .ai-tail .txt h4{margin:0 0 4px;font-size:16px;}
  .ai-tail .txt p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:420px;}
  .ai-tail .prices{display:flex;gap:16px;}
  .ai-tail .prices div{text-align:center;}
  .ai-tail .prices .amt{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .ai-tail .prices .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}

  /* ---------- example preview boxes (shown inside wizard steps) ---------- */
  .example{
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper-raised);margin-bottom:18px;
  }
  .example .example-label{
    font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);
    padding:8px 14px;border-bottom:1px solid var(--line);background:var(--sage-soft);
  }
  .example .example-body{padding:16px;}
  .mini-hero{
    background:linear-gradient(160deg,var(--navy),#141a2e);color:#fff;border-radius:var(--radius);
    padding:22px 18px;position:relative;overflow:hidden;
  }
  .mini-hero h5{margin:0 0 6px;font-size:19px;font-family:'Fraunces',serif;font-weight:600;}
  .mini-hero p{margin:0;font-size:12.5px;opacity:.85;max-width:70%;}
  .mini-highlights{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
  .mini-highlights div{background:rgba(255,255,255,.1);border-radius:4px;padding:8px 6px;text-align:center;}
  .mini-highlights .v{font-weight:800;font-size:14px;color:var(--gold-soft);}
  .mini-highlights .l{font-size:9.5px;opacity:.8;margin-top:2px;}
  .mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  @media (max-width:560px){.mini-cards{grid-template-columns:1fr 1fr;} .mini-highlights{grid-template-columns:1fr 1fr;}}
  .mini-cards .c{border:1px solid var(--line);border-radius:4px;padding:10px;font-size:11.5px;}
  .mini-cards .c b{display:block;font-size:12.5px;margin-bottom:3px;}
  .mini-cards .c span{color:var(--ink-soft);}

  /* ---------- wizard ---------- */
  .wizard-wrap{padding:34px 0 90px;}
  .progress-line{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .progress-line .seg{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-line .seg i{display:block;height:100%;background:var(--seal);width:0;transition:width .25s ease;}
  .form-no{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.3px;margin-bottom:22px;}
  .form-no b{color:var(--seal);}

  .card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 28px;box-shadow:var(--shadow);
  }
  @media (max-width:640px){.card{padding:22px 18px;}}
  .step-title{font-size:24px;font-weight:600;margin:0 0 6px;}
  .step-sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px;}

  label.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  label.field-label .opt{color:var(--ink-soft);font-weight:500;font-style:italic;}
  input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--paper);color:var(--ink);font-size:14.5px;font-family:inherit;margin-bottom:16px;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--seal);outline-offset:1px;}
  textarea{resize:vertical;min-height:80px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}

  .field-with-skip{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;background:var(--paper);}
  .field-with-skip .fws-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .skip-chip{
    font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--paper-raised);
    color:var(--ink-soft);border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap;
  }
  .skip-chip.active{background:var(--seal);border-color:var(--seal);color:#fff;}
  .skip-chip:hover{border-color:var(--seal);}
  .skipped-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;}

  .upload-box{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;
    background:var(--paper);transition:border-color .15s;
  }
  .upload-box:hover{border-color:var(--seal);}
  .upload-box input{display:none;}
  .upload-box .up-icon{font-size:22px;margin-bottom:6px;}
  .upload-box .up-txt{font-size:13px;color:var(--ink-soft);}
  .preview-thumb{position:relative;display:inline-block;margin:6px 6px 0 0;}
  .preview-thumb img{width:84px;height:84px;object-fit:cover;border-radius:4px;border:1px solid var(--line);}
  .preview-thumb .rm{
    position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--seal);
    color:#fff;border:none;font-size:12px;cursor:pointer;line-height:20px;
  }

  .repeat-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--paper);position:relative;}
  .repeat-item .rm-item{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;}
  .repeat-item .rm-item:hover{color:var(--seal);}
  .add-more{border:1px dashed var(--line);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:13.5px;font-weight:700;background:transparent;width:100%;}
  .add-more:hover{border-color:var(--seal);color:var(--seal);}

  .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  @media (max-width:560px){.check-grid{grid-template-columns:1fr;}}
  .check-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;font-size:13.5px;cursor:pointer;background:var(--paper);}
  .check-item.on{border-color:var(--sage);background:var(--sage-soft);}
  .check-item input{margin:0;}

  .wizard-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
  .wizard-nav .right-group{display:flex;gap:10px;}

  .plan-pill{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    border:1px solid var(--line);border-radius:99px;padding:5px 12px;margin-bottom:18px;color:var(--ink-soft);
  }
  .plan-pill b{color:var(--ink);}

  /* ---------- success ---------- */
  .success-wrap{padding:70px 0 100px;text-align:center;}
  .seal-stamp{
    width:78px;height:78px;border-radius:50%;border:3px solid var(--sage);color:var(--sage);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 22px;
    transform:rotate(-8deg);
  }
  .success-wrap h2{font-size:28px;margin:0 0 10px;}
  .success-wrap p{color:var(--ink-soft);max-width:460px;margin:0 auto 28px;}
  .success-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:34px;}
  .receipt{
    max-width:520px;margin:0 auto;text-align:left;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--paper-raised);padding:20px 22px;font-size:13.5px;
  }
  .receipt .r-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);}
  .receipt .r-row:last-child{border-bottom:none;}
  .receipt .r-row span:first-child{color:var(--ink-soft);}

  /* ---------- admin ---------- */
  .admin-wrap{padding:40px 0 90px;}
  .admin-gate{max-width:380px;margin:60px auto;text-align:center;}
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tab{padding:10px 4px;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-right:16px;}
  .tab.active{color:var(--ink);border-bottom-color:var(--seal);}
  .lead-row{
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;background:var(--paper-raised);
    cursor:pointer;
  }
  .lead-row .lr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .lead-row .lr-top .name{font-weight:700;font-size:15px;}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.3px;}
  .badge.basic{background:var(--sage-soft);color:var(--sage);}
  .badge.advanced{background:var(--gold-soft);color:var(--gold);}
  .lead-row .lr-meta{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .lead-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;display:none;}
  .lead-detail.open{display:block;}
  .lead-detail dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 10px;}
  .lead-detail dt{color:var(--ink-soft);}
  .lead-detail dd{margin:0;}
  .empty-state{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .settings-block{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;background:var(--paper-raised);}
  .settings-block h4{margin:0 0 4px;font-size:15px;}
  .settings-block p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:var(--radius);font-size:13.5px;font-weight:600;z-index:100;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  footer.site{border-top:1px solid var(--line);padding:26px 0;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .hidden{display:none !important;}
  ::selection{background:var(--gold-soft);}
</style>
</head>

<script>
/* =========================================================================
   STATE
========================================================================= */
const FACILITY_PRESETS = [
  "Science Labs","Computer Lab","Library","Auditorium","Sports Ground",
  "Art & Music Room","Smart Classrooms","Transport / Bus Facility",
  "Medical Room","Cafeteria / Canteen","Hostel Facility","STEM / Robotics Lab"
];
const CURRICULUM_PRESETS = [
  "Pre-Primary (Nursery–UKG)","Primary Wing (I–V)","Middle School (VI–VIII)",
  "Senior Secondary (IX–XII)","CBSE Curriculum","ICSE Curriculum","State Board Curriculum"
];
function blankData(){
  return {
    schoolName:'', tagline:'', address:'', phone:'', email:'', established:'', board:'',
    logo:null, logoSkipped:false,
    heroImage:null, heroImageSkipped:false,
    highlights:[{label:'',value:''},{label:'',value:''},{label:'',value:''},{label:'',value:''}],
    highlightsSkipped:false,

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function resizeImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function render(){
  const app = document.getElementById('app');
  if (state.view === 'home') app.innerHTML = renderHome();
  else if (state.view === 'wizard') app.innerHTML = renderWizard();

  else if (state.view === 'admin') app.innerHTML = renderAdmin();
  window.scrollTo({top:0,behavior:'instant'});
  afterRender();
}

async function trySupabaseSync(lead){
  const cfg = getSupabaseConfig();
  if (!cfg || !cfg.enabled || !cfg.url || !cfg.anonKey) return;
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/leads', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': cfg.anonKey,
        'Authorization': 'Bearer ' + cfg.anonKey,
        'Prefer':'return=minimal'
      },
      body: JSON.stringify([{ id: lead.id, submitted_at: lead.submittedAt, plan: lead.plan, data: lead.data }])
    });
    if (!res.ok){ console.warn('Supabase sync failed', res.status); }
  }catch(e){ console.warn('Supabase sync error', e); }
}

/* -------- pull leads (and their images) DOWN from Supabase into this device -------- */
async function fetchCloudLeads(){
  const cfg = getSupabaseConfig();
  if (!cfg || !cfg.enabled || !cfg.url || !cfg.anonKey) return null;
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/leads?select=*&order=submitted_at.desc', {
      method:'GET',
      headers:{ 'apikey': cfg.anonKey, 'Authorization': 'Bearer ' + cfg.anonKey }
    });
    if (!res.ok){ console.warn('Cloud fetch failed', res.status, await res.text()); return {error:res.status}; }
    const rows = await res.json();
    return { rows: rows.map(r => ({ id: r.id, submittedAt: r.submitted_at, plan: r.plan, data: r.data })) };
  }catch(e){ console.warn('Cloud fetch error', e); return {error:'network'}; }
}

async function syncCloudLeads(showFeedback){
  const cfg = getSupabaseConfig();
  if (!cfg || !cfg.enabled || !cfg.url || !cfg.anonKey){
    if (showFeedback) toast('Turn on Supabase sync in Settings first');
    return;
  }
  if (showFeedback) toast('Syncing from cloud…');
  const result = await fetchCloudLeads();
  if (!result || result.error){
    if (showFeedback){
      if (result && result.error === 401 || result && result.error === 403){
        showManualCopy(
          `Cloud sync could not read leads (HTTP ${result.error}).\n\nThis almost always means your Supabase table's Row Level Security only allows INSERT, not SELECT, for the public anon key — which is correct for security by default, but it also blocks the Admin panel from pulling leads back down.\n\nTo fix it, run this in your Supabase SQL editor:\n\ncreate policy \"Admin can read leads\" on leads\nfor select\nusing (true);\n\nNote: this makes every stored lead (including uploaded images) readable by anyone who has your site's public anon key, since it lives in this HTML file. For a public school-leads form that's usually an acceptable trade-off, but if you want it locked down, ask about restricting reads through a private Edge Function instead of the public anon key.`,
          'cloud-sync-fix.txt'
        );
      } else if (result && result.error === 404){
        showManualCopy(
          `Cloud sync failed (HTTP 404) — the "leads" table doesn't exist yet in this Supabase project. Run supabase_schema.sql in your Supabase SQL editor first, then try Sync again.`,
          'cloud-sync-fix.txt'
        );
      } else {
        toast('Cloud sync failed — check Settings → Test connection for details');
      }
    }
    return;
  }
  const local = getLeads();
  let added = 0;
  result.rows.forEach(lead=>{
    if (!local.find(l=>l.id===lead.id)){ local.unshift(lead); added++; }
  });
  local.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  saveLeadsAll(local);
  if (showFeedback) toast(added ? `Synced ${added} new lead(s) from the cloud` : 'Already up to date');
  render();
}

async function downloadLeadJSON(){
  const lead = lastSubmittedLead; if (!lead) return;
  const filename = `paperera_${(lead.data.schoolName||'lead').replace(/[^a-z0-9]+/gi,'_').toLowerCase()}_${Date.now()}.json`;
  const jsonStr = JSON.stringify(lead, null, 2);
  try{
    const downloads = await claude.use('downloads');
    if (downloads){
      const res = await downloads.save({filename, data: jsonStr});
      toast(res.status === 'saved' ? 'Downloaded!' : 'File sent.');
      return;
    }
  }catch(e){ /* fall through to manual */ }
  if (triggerBrowserDownload(filename, jsonStr, 'application/json')){
    toast('Downloaded!');
    return;
  }
  showManualCopy(jsonStr, filename);
}

function copySummary(){
  const text = buildSummaryText();
  navigator.clipboard?.writeText(text).then(()=>toast('Summary copied!')).catch(()=>showManualCopy(text,'summary.txt'));

function sendToWhatsApp(){
  const cfg = getSupabaseConfig();
  const number = (JSON.parse(localStorage.getItem('paperera_settings')||'{}').receiveWhatsapp || '').replace(/[^0-9]/g,'');
  const text = encodeURIComponent(buildSummaryText());
  const url = number ? `https://wa.me/${number}?text=${text}` : `https://wa.me/?text=${text}`;
  window.open(url, '_blank');
}

function triggerBrowserDownload(filename, data, mime){
  try{
    const blob = new Blob([data], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ console.warn('browser download failed', e); return false; }
}

function showManualCopy(text, filename){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';

  </div>`;
  document.body.appendChild(modal);
}

          <dt>Logo</dt><dd>${l.data.logo ? 'Included in this record' : (l.data.logoSkipped?'Skipped':'Not added')}</dd>
        </dl>
        <div style="margin-top:10px;text-align:right;"><button class="btn ghost sm" onclick="event.stopPropagation();deleteLead(${i})">Delete</button></div>
      </div>
    </div>
  `).join('');
}

function renderAdminImport(){
  return `
  <div class="settings-block">
    <h4>Import a submission</h4>
    <p class="hint">If a client downloaded their submission and sent it to you (WhatsApp/email), paste that JSON here, or upload the file.</p>
    <textarea id="import_area" placeholder="Paste the submission JSON here" style="min-height:140px;font-family:monospace;font-size:12px;"></textarea>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn gold sm" onclick="importPasted()">Import from text</button>
      <label class="btn ghost sm" style="cursor:pointer;">Upload .json file
        <input type="file" accept=".json,application/json" style="display:none;" onchange="importFromFile(this)">
      </label>
    </div>
  </div>`;
}

function renderAdminSettings(){
  const s = getAdminSettings();
  const sb = getSupabaseConfig() || {url:'',anonKey:'',enabled:false};
  return `
  <div class="settings-block">
    <h4>Admin passcode</h4>
    <p class="hint">Change the passcode used to open this panel (stored only on this device).</p>
    <input type="text" id="s_passcode" value="${esc(s.passcode||'')}" placeholder="Passcode">
    <button class="btn ghost sm" onclick="saveGeneralSettings()">Save</button>
  </div>
  <div class="settings-block">
    <h4>WhatsApp number to receive leads</h4>
    <p class="hint">Used by the client's "Send via WhatsApp" button after they submit a form.</p>
    <input type="text" id="s_whatsapp" value="${esc(s.receiveWhatsapp||'')}" placeholder="+91 9XXXXXXXXX">
    <button class="btn ghost sm" onclick="saveGeneralSettings()">Save</button>
  </div>
  <div class="settings-block">
    <h4>Supabase sync <span style="font-size:11px;color:var(--ink-soft);font-weight:600;">(optional)</span></h4>
    <p class="hint">Connect your own Supabase project so every submission, from any device, lands in your database automatically. Run the schema in <code>supabase_schema.sql</code> (provided alongside this file) to create the <code>leads</code> table. For this to work the same on every device without re-entering it, ask whoever set up the site to fill in the <code>DEFAULT_SUPABASE_CONFIG</code> block near the top of the script in paperera.html. What you save below only overrides it on this one browser/device.</p>
    <label class="field-label">Project URL</label>
    <input type="text" id="sb_url" value="${esc(sb.url)}" placeholder="https://xxxx.supabase.co">
    <label class="field-label">Anon public key</label>
    <input type="text" id="sb_key" value="${esc(sb.anonKey)}" placeholder="eyJhbGciOi...">
    <label class="check-item ${sb.enabled?'on':''}" style="display:inline-flex;margin-bottom:14px;">
      <input type="checkbox" id="sb_enabled" ${sb.enabled?'checked':''}> Enable Supabase sync
    </label>
    <br>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="btn ghost sm" onclick="saveSupabaseSettings()">Save Supabase settings</button>
      <button class="btn ghost sm" onclick="testSupabaseConnection()">Test connection</button>
      <button class="btn ghost sm" onclick="clearDeviceSupabaseOverride()">Clear this device's override</button>
    </div>
  </div>
  <div class="settings-block">
    <h4>Danger zone</h4>
    <p class="hint">Clears every lead stored on this device. Cannot be undone.</p>
    <button class="btn ghost sm" onclick="clearAllLeads()" style="border-color:var(--seal);color:var(--seal);">Delete all leads</button>
  </div>
  `;
}

function setAdminTab(t){ state.adminTab = t; render(); }
function toggleLeadDetail(i){ const el = document.getElementById('lead_detail_'+i); if (el) el.classList.toggle('open'); }
function deleteLead(i){
  const leads = getLeads(); leads.splice(i,1); saveLeadsAll(leads); render(); toast('Lead deleted');
}
function clearAllLeads(){
  if (!confirm('Delete all stored leads on this device?')) return;
  saveLeadsAll([]); render(); toast('All leads cleared');
}
function tryUnlockAdmin(){
  const entered = document.getElementById('f_passcode').value;
  const s = getAdminSettings();
  const expected = s.passcode || DEFAULT_ADMIN_SETTINGS.passcode;
  if (entered === expected){ state.adminUnlocked = true; state.adminTab='leads'; render(); syncCloudLeads(false); }
  else toast('Incorrect passcode');
}
function saveGeneralSettings(){
  const s = getAdminSettings();
  s.passcode = document.getElementById('s_passcode').value || DEFAULT_ADMIN_SETTINGS.passcode;
  s.receiveWhatsapp = document.getElementById('s_whatsapp').value || '';
  setAdminSettings(s); toast('Settings saved');
}
function saveSupabaseSettings(){
  const cfg = {
    url: document.getElementById('sb_url').value.trim(),
    anonKey: document.getElementById('sb_key').value.trim(),
    enabled: document.getElementById('sb_enabled').checked
  };
  setSupabaseConfig(cfg); toast('Supabase settings saved');
}
function clearDeviceSupabaseOverride(){
  localStorage.removeItem('paperera_supabase');
  toast('Cleared — this browser now uses the config baked into the file');
  render();
}
async function testSupabaseConnection(){
  const cfg = {
    url: document.getElementById('sb_url').value.trim(),
    anonKey: document.getElementById('sb_key').value.trim()
  };
  if (!cfg.url || !cfg.anonKey){ showManualCopy('Fill in both Project URL and Anon public key first, then try again.', 'supabase-test.txt'); toast('Fill in URL and key first'); return; }
  toast('Testing…');
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/leads?select=id&limit=1', {
      method:'GET',
      headers:{ 'apikey': cfg.anonKey, 'Authorization': 'Bearer ' + cfg.anonKey }
    });
    const bodyText = await res.text();
    if (res.ok){
      toast('✓ Connected — the leads table is reachable');
    } else {
      let hint = '';
      if (res.status === 401 || res.status === 403) hint = 'This usually means the anon key is wrong, incomplete, or doesn\'t match this project.';
      else if (res.status === 404) hint = 'This usually means the "leads" table doesn\'t exist yet — run supabase_schema.sql in your Supabase SQL editor.';
      else if (res.status === 400) hint = 'Check the Project URL is exactly right (no trailing text/spaces).';
      showManualCopy(
        `Supabase test failed.\n\nHTTP status: ${res.status}\n\nResponse body:\n${bodyText}\n\n${hint}`,
        'supabase-test-result.txt'
      );
      toast('✗ Failed — see details');
    }
  }catch(e){
    showManualCopy(
      `Supabase test failed with a network/CORS error before a response came back.\n\nError: ${e.message}\n\nCommon causes:\n- The Project URL is wrong or has a typo\n- No internet connection\n- The browser blocked the request (rare for Supabase, which allows all origins by default)\n\nOpen your browser's DevTools → Network tab and retry to see the exact failed request for more detail.`,
      'supabase-test-error.txt'
    );
    toast('✗ Network error — see details');
  }
}

function importPasted(){
  const txt = document.getElementById('import_area').value.trim();
  if (!txt) return;
  try{ mergeImportedLead(JSON.parse(txt)); toast('Imported!'); render(); }
  catch(e){ toast('That did not look like valid JSON'); }
}
function importFromFile(input){
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{ mergeImportedLead(JSON.parse(e.target.result)); toast('Imported!'); render(); }
    catch(err){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
}
function mergeImportedLead(obj){
  const leads = getLeads();
  const incoming = Array.isArray(obj) ? obj : [obj];
  incoming.forEach(lead=>{
    if (!lead.id) lead.id = 'lead_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    if (!leads.find(l=>l.id===lead.id)) leads.unshift(lead);
  });
  saveLeadsAll(leads);
}

async function exportAll(type){
  const leads = getLeads();
  if (!leads.length){ toast('No leads to export'); return; }
  let filename, data;
  if (type === 'json'){
    filename = `paperera_leads_${Date.now()}.json`;
    data = JSON.stringify(leads, null, 2);
  } else {
    const headers = ['School','Plan','Phone','Email','WhatsApp','Address','Board','Domain','AI Paper Tier','Total Amount','Gallery Photos','Submitted'];
    const rows = leads.map(l=>[
      l.data.schoolName, l.plan, l.data.phone, l.data.email, l.data.whatsapp, l.data.address, l.data.board,
      l.data.domainChoice==='custom' ? `${l.data.domainName||''}${l.data.domainExtension||''}` : 'free subdomain',
      l.data.aiPaperTier||'none',
      planBasePrice(l.plan) + domainPrice(l.data) + aiPaperPrice(l.data),
      (l.data.gallery||[]).length,
      l.submittedAt
    ].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(','));
    filename = `paperera_leads_${Date.now()}.csv`;
    data = [headers.join(','), ...rows].join('\n');
  }
  try{
    const downloads = await claude.use('downloads');
    if (downloads){ await downloads.save({filename, data}); toast('Exported!'); return; }
  }catch(e){}
  if (triggerBrowserDownload(filename, data, type==='json' ? 'application/json' : 'text/csv')){
    toast('Exported!');
    return;
  }
  showManualCopy(data, filename);
}
